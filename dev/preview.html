<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Servora — UI preview harness</title>
    <style>
      body {
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div id="app" class="min-h-screen"></div>
    <div
      id="toast-host"
      class="pointer-events-none fixed inset-x-0 bottom-4 z-50 flex flex-col items-center gap-2 px-4"
      role="status"
      aria-live="polite"
    ></div>
    <script type="module">
      /*
       * Design preview harness — DEVELOPMENT ONLY.
       *
       * Serves the real frontend against a canned Tauri bridge so layout and
       * styling can be reviewed in a browser. It never talks to systemd and is
       * never part of a production build (`vite build` only bundles index.html).
       * The canned data mirrors the exact JSON shape returned by Rust.
       */
      const now = Date.now();
      const services = [
        {
          id: "httpd",
          unit: "httpd.service",
          name: "Apache HTTP Server",
          state: "active",
          subState: "running",
          loadState: "loaded",
          unitFileState: "enabled",
          description: "The Apache HTTP Server",
          installed: true,
          masked: false,
          observedAtMs: now,
        },
        {
          id: "php-fpm",
          unit: "php-fpm.service",
          name: "PHP-FPM",
          state: "active",
          subState: "running",
          loadState: "loaded",
          unitFileState: "enabled",
          description: "The PHP FastCGI Process Manager",
          installed: true,
          masked: false,
          observedAtMs: now,
        },
        {
          id: "mariadb",
          unit: "mariadb.service",
          name: "MariaDB",
          state: "failed",
          subState: "failed",
          loadState: "loaded",
          unitFileState: "enabled",
          description: "MariaDB 11.8 database server",
          installed: true,
          masked: false,
          observedAtMs: now,
        },
      ];

      const settings = {
        theme: new URLSearchParams(location.search).get("theme") || "dark",
        autoRefresh: true,
        refreshIntervalMs: 3000,
        minimizeToTray: true,
        startMinimized: false,
        showNotifications: true,
        logLineLimit: 300,
      };

      const logs = Array.from({ length: 40 }, (_, index) => {
        const line = index + 1;
        const messages = [
          "AH00558: httpd: Could not reliably determine the server's fully qualified domain name",
          "Server configured, listening on: port 80",
          "Started httpd.service - The Apache HTTP Server.",
          "GET /index.php HTTP/1.1 200 1244",
          "PHP Warning:  Undefined array key \"id\" in /var/www/html/index.php on line 12",
        ];
        const stamp = new Date(now - (40 - index) * 61_000)
          .toISOString()
          .replace("Z", "+0000");
        return {
          timestamp: stamp,
          ident: index % 5 === 2 ? "systemd" : "httpd",
          message: messages[index % messages.length],
        };
      });


      const hostInfo = {
        fedoraVersion: "45",
        architecture: "x86_64",
        kernel: "6.17.4-200.fc45.x86_64",
        user: "user",
        home: "/home/user",
        selinux: "Enforcing",
      };

      const siteStatus = {
        configPath: "/etc/httpd/conf.d/e-perpus-skenda.com.conf",
        configExists: true,
        configOwner: "managed by Servora",
        servesDomain: true,
        documentRoot: "/home/user/Work/e-perpus-skenda/public",
        documentRootExists: true,
        hostsState: "managed",
        healthy: true,
        warnings: [],
      };

      let websites = [
        {
          id: "e-perpus-skenda",
          name: "e-perpus-skenda",
          domain: "e-perpus-skenda.com",
          projectPath: "/home/user/Work/e-perpus-skenda",
          documentRoot: "/home/user/Work/e-perpus-skenda/public",
          projectType: "laravel",
          origin: "importedSiteForge",
          createdAtMs: Date.now() - 86400000 * 12,
          updatedAtMs: Date.now() - 3600000 * 5,
          url: "http://e-perpus-skenda.com/",
          state: "live",
          status: siteStatus,
        },
        {
          id: "red-shop",
          name: "red-shop",
          domain: "red-shop.com",
          projectPath: "/home/user/Work/red-shop",
          documentRoot: "/home/user/Work/red-shop/public",
          projectType: "wordpress",
          origin: "created",
          createdAtMs: Date.now() - 86400000 * 4,
          updatedAtMs: Date.now() - 60000 * 42,
          url: "http://red-shop.com/",
          state: "hosts-missing",
          status: {
            ...siteStatus,
            configPath: "/etc/httpd/conf.d/red-shop.com.conf",
            hostsState: "absent",
            healthy: false,
            warnings: ["/etc/hosts has no entry for this domain"],
          },
        },
        {
          id: "inventory-api",
          name: "inventory-api",
          domain: "inventory-api.test",
          projectPath: "/home/user/Work/inventory-api",
          documentRoot: "/home/user/Work/inventory-api/public",
          projectType: "php",
          origin: "created",
          createdAtMs: Date.now() - 86400000 * 2,
          updatedAtMs: Date.now() - 60000 * 8,
          url: "http://inventory-api.test/",
          state: "live",
          status: { ...siteStatus, configPath: "/etc/httpd/conf.d/inventory-api.test.conf" },
        },
      ];

      const history = [
        { atMs: Date.now() - 60000 * 8, operation: "create", website: "inventory-api", success: true, summary: "7 steps completed" },
        { atMs: Date.now() - 60000 * 42, operation: "update", website: "red-shop", success: true, summary: "6 steps completed" },
        { atMs: Date.now() - 3600000 * 5, operation: "import", website: "e-perpus-skenda", success: true, summary: "8 steps completed" },
      ];

      const scenario = new URLSearchParams(location.search).get("scenario") || "";

      function degraded() {
        return services.map((service) => ({
          ...service,
          state: "unknown",
          subState: "",
          installed: false,
        }));
      }

      const handlers = {
        get_services_status: () =>
          scenario === "degraded"
            ? {
                services: degraded(),
                allRunning: false,
                running: 0,
                total: 3,
                systemdAvailable: false,
                observedAtMs: Date.now(),
                error: {
                  code: "systemd_unavailable",
                  message: "systemd is not available on this system",
                  hint: "This system does not run systemd (containers usually do not). Servora needs systemd to manage services.",
                },
              }
            : {
                services,
                allRunning: services.every((s) => s.state === "active"),
                running: services.filter((s) => s.state === "active").length,
                total: services.length,
                systemdAvailable: true,
                observedAtMs: Date.now(),
              },
        get_service_status: () => services[0],
        get_app_settings: () => settings,
        save_app_settings: (args) => Object.assign(settings, args.settings),
        get_app_info: () => ({
          name: "Servora",
          version: "0.1.0",
          identifier: "dev.servora.app",
          description: "Local Development Service Manager",
          repository: "https://github.com/Ghaizan17/servora",
          license: "MIT",
          configPath: "/home/user/.config/servora/config.json",
          logPath: "/home/user/.local/state/servora/servora.log",
          managedUnits: ["httpd.service", "php-fpm.service", "mariadb.service"],
          runningAsRoot: false,
        }),
        get_authorization_info: () => ({
          actionId: "org.freedesktop.systemd1.manage-units",
          mechanism: "systemd D-Bus + Polkit",
          runsAsRoot: false,
          helperInstalled: false,
          notes: [
            "Servora never runs as root and never stores credentials.",
            "Service control is sent to systemd over the system bus; systemd asks Polkit for approval.",
            "Only httpd.service, php-fpm.service and mariadb.service can be addressed.",
            "Arguments are fixed in Rust. No shell is involved and no command text comes from the UI.",
          ],
        }),
        get_settings_limits: () => ({
          minRefreshIntervalMs: 1000,
          maxRefreshIntervalMs: 60000,
          minLogLines: 50,
          maxLogLines: 5000,
        }),
        get_logs_context: () => ({
          defaultLineLimit: 300,
          minLineLimit: 50,
          maxLineLimit: 5000,
        }),
        get_service_logs: (args) => {
          if (scenario === "logerror") {
            throw {
              code: "log_retrieval_failed",
              message:
                "Failed to open /var/log/journal: Permission denied",
              hint:
                "Make sure `journalctl` is available and your user can read the journal (`usermod -aG systemd-journal $USER`).",
            };
          }
          return {
            service: args.request.service,
            unit: `${args.request.service}.service`,
            level: args.request.level,
            entries: logs.slice(-(args.request.limit || 300)),
            count: Math.min(logs.length, args.request.limit || 300),
            truncated: false,
            requestedLines: args.request.limit || 300,
            retrievedAtMs: Date.now(),
          };
        },
        // ---------------------------------------------------- website manager
        get_websites: () =>
          new URLSearchParams(location.search).get("empty") === "1" ? [] : websites,
        get_website: (args) => websites.find((site) => site.id === args.website),
        get_website_history: () => history,
        get_virtualhost_status: () => ({
          owner: "servora",
          serverNames: ["e-perpus-skenda.com"],
          serverAliases: ["www.e-perpus-skenda.com"],
          documentRoots: ["/home/user/Work/e-perpus/public"],
          directoryRoots: ["/home/user/Work/e-perpus/public"],
          port: "80",
        }),
        detect_project_type: (args) => ({
          projectPath: args.request.path,
          projectType: "laravel",
          documentRoot: `${args.request.path.replace(/\/+$/, "")}/public`,
          detectedBy: ["artisan", "composer.json", "public/index.php"],
          hasArtisan: true,
          hasComposer: true,
          hasPublicIndex: true,
          hasRootIndex: false,
          hasWpConfig: false,
          writableDirs: ["storage", "bootstrap/cache"],
          warnings: [],
        }),
        detect_document_root: (args) =>
          handlers.detect_project_type(args),
        validate_domain: (args) => {
          const domain = String(args.domain || "").trim();
          if (!/^[a-z0-9.-]+\.[a-z]{2,}$/i.test(domain)) {
            return {
              valid: false,
              domain,
              message: "Enter a valid domain such as my-project.test",
              hint: "Lowercase letters, digits, dots and dashes only.",
            };
          }
          return {
            valid: true,
            domain: domain.toLowerCase(),
            isLocalDevelopment: true,
            suffix: "test",
            url: `http://${domain.toLowerCase()}/`,
            takenByServora: false,
            hostsState: "managed",
          };
        },
        check_domain_conflicts: () => ({
          nameTaken: false,
          domainTaken: false,
          configExists: false,
          hostsState: "absent",
          projectExists: true,
          documentRootExists: true,
          blocking: false,
          warnings: [],
        }),
        create_website: (args) => {
          const request = args.request;
          const record = {
            id: request.name,
            name: request.name,
            domain: request.domain,
            projectPath: request.projectPath,
            documentRoot: request.documentRoot || `${request.projectPath}/public`,
            projectType: request.projectType || "laravel",
            origin: "created",
            createdAtMs: Date.now(),
            updatedAtMs: Date.now(),
          };
          websites.push({
            ...record,
            url: `http://${record.domain}/`,
            state: "live",
            status: {
              configPath: `/etc/httpd/conf.d/${record.domain}.conf`,
              configExists: true,
              configOwner: "managed by Servora",
              servesDomain: true,
              documentRoot: record.documentRoot,
              documentRootExists: true,
              hostsState: "managed",
              healthy: true,
              warnings: [],
            },
          });
          return {
            operation: "create",
            websiteId: record.id,
            websiteName: record.name,
            success: true,
            outcome: { operation: "create", success: true, steps: [], warnings: [], warningsRollback: null },
            website: record,
            warnings: [],
          };
        },
        update_website: (args) => handlers.create_website({ request: args.request }),
        rename_website: (args) =>
          handlers.update_website({
            website: args.request.website,
            request: {
              ...websites.find((site) => site.id === args.request.website),
              domain: args.request.domain,
            },
          }),
        remove_website: (args) => {
          websites = websites.filter((site) => site.id !== args.website);
          return {
            operation: "remove",
            websiteId: args.website,
            websiteName: args.website,
            success: true,
            outcome: { operation: "remove", success: true, steps: [], warnings: [] },
            warnings: ["source files were left untouched"],
          };
        },
        get_managed_domains: () => ({
          domains: (new URLSearchParams(location.search).get("empty") === "1" ? [] : websites).map((site, index) => ({
            domain: site.domain,
            ip: "127.0.0.1",
            website: site.name,
            websiteId: site.id,
            managed: true,
            line: index + 3,
          })),
          hostsPath: "/etc/hosts",
          servoraWebsites: (new URLSearchParams(location.search).get("empty") === "1" ? [] : websites).map((site) => ({
            domain: site.domain,
            website: site.name,
            websiteId: site.id,
          })),
        }),
        preview_siteforge_migration: () =>
          scenario === "nomigration"
            ? { scannedAtMs: Date.now(), confDir: "/etc/httpd/conf.d", siteforgeInstalled: false, candidates: [], ignored: [] }
            : {
                scannedAtMs: Date.now(),
                confDir: "/etc/httpd/conf.d",
                siteforgeInstalled: true,
                candidates: [
                  {
                    name: "e-perpus-skenda",
                    domain: "e-perpus-skenda.com",
                    projectPath: "/home/user/Work/e-perpus-skenda",
                    documentRoot: "/home/user/Work/e-perpus-skenda/public",
                    projectType: "laravel",
                    configPath: "/etc/httpd/conf.d/e-perpus-skenda.com.conf",
                    owner: "managed by siteForge",
                    importable: true,
                    alreadyImported: false,
                    hostsState: "managed",
                    hostsOccurrences: 2,
                    warnings: ["appears twice in /etc/hosts"],
                  },
                  {
                    name: "ict-project",
                    domain: "ict-project.test",
                    projectPath: "/home/user/Work/ict-project",
                    documentRoot: "/home/user/Work/ict-project",
                    projectType: "php",
                    configPath: "/etc/httpd/conf.d/ict-project.test.conf",
                    owner: "hand written .test",
                    importable: true,
                    alreadyImported: false,
                    hostsState: "unmanaged",
                    hostsOccurrences: 1,
                    warnings: [],
                  },
                ],
                ignored: ["ssl.conf"],
              },
        import_siteforge_websites: () => ({ imported: [], skipped: [], failed: [] }),
        get_environment_diagnostics: () => ({
          host: hostInfo,
          checks: [
            { id: "apache-installed", label: "Apache httpd", status: "passed", detail: "httpd 2.4.71 is installed and enabled." },
            { id: "apache-running", label: "Apache running", status: "passed", detail: "httpd.service is active (running)." },
            { id: "php-fpm", label: "PHP-FPM", status: "passed", detail: "php-fpm 8.5.11 with the www pool socket." },
            { id: "mariadb", label: "MariaDB", status: "warning", detail: "mariadb.service is installed but stopped.", remediation: "systemctl start mariadb.service" },
            { id: "selinux", label: "SELinux", status: "passed", detail: "Enforcing — Servora sets contexts, never disables SELinux." },
            { id: "helper", label: "Privileged helper", status: "failed", detail: "servora-helper was not found at /usr/libexec/servora-helper.", remediation: "sudo dnf install --refresh ./Servora-0.1.0-1.x86_64.rpm" },
            { id: "hosts", label: "Hosts file", status: "passed", detail: "3 managed domains, 0 duplicates." },
          ],
          summary: { passed: 5, warnings: 1, failed: 1, notApplicable: 0, total: 7 },
          generatedAtMs: Date.now(),
        }),
        get_environment_setup: () => ({
          host: hostInfo,
          components: [
            { id: "apache-installed", label: "Apache HTTP Server", status: "passed", detail: "httpd 2.4.71", package: "httpd" },
            { id: "php-installed", label: "PHP 8", status: "passed", detail: "PHP 8.5.11", package: "php" },
            { id: "php-fpm", label: "PHP-FPM", status: "passed", detail: "php-fpm 8.5.11", package: "php-fpm" },
            { id: "mariadb", label: "MariaDB", status: "passed", detail: "MariaDB 12.3.2", package: "mariadb-server" },
            { id: "selinux", label: "SELinux tools", status: "passed", detail: "policycoreutils-python-utils present", package: "policycoreutils-python-utils" },
            { id: "helper", label: "Servora helper", status: "failed", detail: "not installed", package: "servora" },
          ],
          ready: false,
          generatedAtMs: Date.now(),
        }),
        validate_apache_configuration: () => ({
          valid: true,
          output: "Syntax OK",
        }),
        reload_apache: () => ({
          operation: "reload-apache",
          success: true,
          steps: [],
          warnings: [],
        }),
        get_site_paths: () => ({
          configDir: "/home/user/.config/servora",
          dataDir: "/home/user/.local/share/servora",
          backupsDir: "/home/user/.local/share/servora/backups",
          apacheConfDir: "/etc/httpd/conf.d",
          hostsFile: "/etc/hosts",
          helperPath: "/usr/libexec/servora-helper",
          helperInstalled: false,
        }),
        start_service: (args) => ({}, void args),
        "plugin:event|listen": () => 1,
        "plugin:event|unlisten": () => null,
        "plugin:dialog|open": () => null,
        "plugin:opener|open_url": () => null,
      };

      // Tauri registers callback ids for event listeners; the frontend uses the
      // event API (tray, settings), so the mock has to provide it too.
      const callbacks = new Map();
      let nextCallbackId = 0;

      window.__TAURI_INTERNALS__ = {
        metadata: { currentWindow: { label: "main" }, currentWebview: { windowLabel: "main", label: "main" } },
        callbacks,
        transformCallback: (callback, once = false) => {
          const id = ++nextCallbackId;
          callbacks.set(id, (payload) => {
            if (once) callbacks.delete(id);
            callback(payload);
          });
          return id;
        },
        convertFileSrc: (path) => path,
        invoke: async (command, args) => {
          const handler = handlers[command.split("|")[0]] || handlers[command];
          if (!handler) throw { code: "not_mocked", message: `no mock for ${command}` };
          return handler(args ?? {});
        },
      };

      await import("/src/main.js");

      // Navigation smoke test: `?smoke=1` clicks every sidebar entry and reports
      // whether each page actually rendered. Used by scripts/ui-smoke.sh with
      // `chrome --headless=new --dump-dom`.
      if (new URLSearchParams(location.search).get("smoke") === "1") {
        const problems = [];
        // Navigation failures are logged rather than thrown, so watch the console.
        const originalConsoleError = console.error.bind(console);
        console.error = (...args) => {
          problems.push(`console.error: ${args.map((value) => String(value)).join(" ")}`);
          originalConsoleError(...args);
        };
        window.addEventListener("error", (event) => {
          problems.push(`${event.message}`);
        });
        window.addEventListener("unhandledrejection", (event) => {
          problems.push(`${event.reason?.message ?? event.reason}`);
        });

        const buttons = [...document.querySelectorAll("[data-route]")];
        // Visit each page twice: leaving a page is what used to break navigation.
        const order = [...buttons, ...[...buttons].reverse()];
        try {
          for (const button of order) {
            const route = button.dataset.route;
            const before = document.querySelector('[data-role="title"]').textContent;
            try {
              button.click();
            } catch (error) {
              problems.push(`${route}: click threw ${error?.message ?? error}`);
            }
            await new Promise((resolve) => setTimeout(resolve, 120));
            const view = document.querySelector('[data-role="view"]');
            const title = document.querySelector('[data-role="title"]').textContent;
            const rendered = view.children.length > 0 && view.textContent.trim().length > 0;
            const rawMarkup = /<div class="|\[object Object\]/.test(view.textContent);
            if (!rendered) problems.push(`${route}: empty view (previous page was ${before})`);
            if (rawMarkup) problems.push(`${route}: raw markup rendered as text`);
            if (title.toLowerCase() !== route.toLowerCase()) {
              problems.push(`${route}: header shows "${title}"`);
            }
            if (location.hash !== `#${route}`) {
              problems.push(`${route}: hash is ${location.hash || "(empty)"}`);
            }

            // Content must keep a gap from the sidebar and the window edge.
            const viewStyle = getComputedStyle(view);
            const padLeft = parseFloat(viewStyle.paddingLeft);
            const padRight = parseFloat(viewStyle.paddingRight);
            if (!(padLeft >= 16) || !(padRight >= 16)) {
              problems.push(`${route}: content padding ${padLeft}px / ${padRight}px`);
            }
            const page = view.firstElementChild;
            if (page && page.getBoundingClientRect().left < 212) {
              problems.push(`${route}: content overlaps the sidebar`);
            }
            if (view.scrollWidth > view.clientWidth + 1) {
              problems.push(`${route}: content overflows horizontally`);
            }
          }
        } catch (error) {
          problems.push(`smoke aborted: ${error?.message ?? error}`);
        }

        const report = document.createElement("pre");
        report.id = "smoke-result";
        report.textContent = problems.length
          ? `SMOKE FAIL\n${problems.join("\n")}`
          : `SMOKE PASS ${order.length} navigations over ${buttons.length} pages`;
        report.style.cssText =
          "position:fixed;bottom:4px;left:4px;z-index:9999;color:#7ef;font:11px monospace";
        document.body.append(report);
        document.title = problems.length ? "SMOKE FAIL" : "SMOKE PASS";
      }
    </script>
  </body>
</html>
