[workspace]
members = ["crates/servora-core", "crates/servora-helper"]
resolver = "2"

[package]
name = "servora"
version = "0.1.1"
edition = "2021"
rust-version = "1.85"
description = "Servora — Local Development Service Manager"
authors = ["Ghaizan"]
license = "MIT"
repository = "https://github.com/Ghaizan17/servora"
default-run = "servora"

[lib]
name = "servora_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
servora-core = { path = "crates/servora-core" }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time", "sync", "io-util"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }
thiserror = "2"
log = "0.4"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
