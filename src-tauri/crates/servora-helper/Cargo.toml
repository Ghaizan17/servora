[package]
name = "servora-helper"
version = "0.1.1"
edition = "2021"
rust-version = "1.85"
description = "Privileged plan executor for Servora (invoked through pkexec)"
license = "MIT"
publish = false

[[bin]]
name = "servora-helper"
path = "src/main.rs"

[dependencies]
servora-core = { path = "../servora-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
